name: Build & Deploy Pages (and commit HTML)

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/content/**"
      - "docs/assets/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install markdown

      - name: Build site (MD -> HTML)
        run: python tools/build_site.py

      - name: Commit rebuilt HTML back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # stage generated site files
          git add docs/*.html docs/sw.js docs/manifest.webmanifest docs/styles.css || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore(pages): rebuild HTML [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
